[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqpack"
version = "0.1.0"
description = "Pack n unit squares into the smallest enclosing square."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Steven Thornton" },
]
keywords = ["square-packing", "optimization", "geometry", "numba"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy",
    "numba",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "vulture"]

[project.scripts]
sqpack = "sqpack.cli:main"

[project.urls]
Homepage = "https://github.com/steventhornton/sqpack"
Issues = "https://github.com/steventhornton/sqpack/issues"

[tool.hatch.build.targets.wheel]
packages = ["sqpack"]

[tool.hatch.build.targets.wheel.force-include]
"sqpack/data/known_best.json" = "sqpack/data/known_best.json"
"sqpack/py.typed" = "sqpack/py.typed"
